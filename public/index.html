<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tasks</title><link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="shell">
    <header><p class="eyebrow">LOCAL WORKSPACE</p><h1>Tasks that move.</h1><p class="intro">A small, fast task list backed by your local PostgreSQL database.</p></header>
    <form id="task-form" class="composer"><input id="title" name="title" maxlength="160" placeholder="What needs doing?" autocomplete="off" required><button type="submit">Add task</button></form>
    <section class="status-row"><span id="count">Loading...</span><button id="clear" class="text-button" type="button">Clear completed</button></section>
    <ul id="tasks" class="tasks"></ul><p id="error" class="error" hidden></p>
  </main>
  <script>
    const list = document.querySelector('#tasks'), form = document.querySelector('#task-form'), input = document.querySelector('#title'), count = document.querySelector('#count'), error = document.querySelector('#error'); let tasks = [];
    async function request(url, options) { const response = await fetch(url, options); if (!response.ok) throw new Error((await response.json()).error || 'Request failed'); return response.status === 204 ? null : response.json(); }
    function render() { count.textContent = `${tasks.filter(task => !task.completed).length} remaining`; list.innerHTML = tasks.map(task => `<li class="task ${task.completed ? 'done' : ''}"><label><input type="checkbox" data-id="${task.id}" ${task.completed ? 'checked' : ''}><span>${escapeHtml(task.title)}</span></label><button class="delete" data-delete="${task.id}" aria-label="Delete task">×</button></li>`).join(''); }
    function escapeHtml(value) { return value.replace(/[&<>'"]/g, character => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[character])); }
    async function load() { tasks = await request('/api/tasks'); render(); }
    form.addEventListener('submit', async event => { event.preventDefault(); try { const task = await request('/api/tasks', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({title: input.value}) }); tasks.unshift(task); input.value = ''; render(); } catch (e) { showError(e); } });
    list.addEventListener('change', async event => { if (!event.target.dataset.id) return; try { const id = event.target.dataset.id; const task = await request(`/api/tasks/${id}`, { method: 'PATCH', headers: {'Content-Type':'application/json'}, body: JSON.stringify({completed: event.target.checked}) }); tasks = tasks.map(item => item.id == id ? task : item); render(); } catch (e) { showError(e); } });
    list.addEventListener('click', async event => { const id = event.target.dataset.delete; if (!id) return; try { await request(`/api/tasks/${id}`, {method:'DELETE'}); tasks = tasks.filter(task => task.id != id); render(); } catch (e) { showError(e); } });
    document.querySelector('#clear').addEventListener('click', async () => { for (const task of tasks.filter(item => item.completed)) await request(`/api/tasks/${task.id}`, {method:'DELETE'}); tasks = tasks.filter(item => !item.completed); render(); });
    function showError(e) { error.textContent = e.message; error.hidden = false; } load().catch(showError);
  </script>
</body>
</html>
