# -----------------------------------------------------------------------------
# Required CI/CD variables (Settings > CI/CD > Variables):
#   DD_URL              DefectDojo base URL, e.g. http://localhost:8080
#   DD_API_KEY          DefectDojo API v2 key                       (masked)
#   NVD_API_KEY         NVD API key for Dependency-Check            (masked)
#   DEPLOY_PGHOST, DEPLOY_PGPORT, DEPLOY_PGDATABASE, DEPLOY_PGUSER
#   DEPLOY_PGPASSWORD                                               (masked)
# Optional:
#   SECURITY_GATE       "true" = fail the pipeline on blocking findings:
#                         verified secrets, Semgrep ERROR, CVSS >= DC_FAIL_ON_CVSS,
#                         fixable CRITICAL image vulnerabilities
#   DD_ORGANIZATION     DefectDojo Organization (default: task)
#   DD_ASSET            DefectDojo Asset        (default: project name)
#
# Runner: Windows shell executor, Windows PowerShell 5.1 or PowerShell 7.
# The runner checks every single-line entry; multi-line blocks check
# $LASTEXITCODE themselves after each native command.
# -----------------------------------------------------------------------------

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never              # avoid duplicate branch + MR pipelines
    - if: '$CI_COMMIT_BRANCH'

stages:
  - build
  - test
  - security_test
  - containerize
  - container_scan
  - publish
  - deploy
  - dast
  - report

default:
  tags:
    - windows

variables:
  IMAGE_NAME: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
  TOOLS_DIR: 'C:\ci-tools'              # persistent tool/cache directory on the runner
  TRIVY_VERSION: "0.74.0"
  SECURITY_GATE: "false"                # switch to "true" once the DefectDojo baseline is triaged
  DC_FAIL_ON_CVSS: "9"
  DEPLOY_ROOT: 'C:\apps\local-tasks'

# ----------------------------------------------------------------------------- build

build:
  stage: build
  script:
    - 'npm ci --omit=dev'
    - 'npm run build'
  artifacts:
    paths:
      - build-output/
    expire_in: 1 week

verify:
  stage: test
  dependencies: []
  script:
    - 'node --check app.js'

# ----------------------------------------------------------------------------- security tests
# dependencies: [] keeps build-output/ out of the workspace so scanners only see source.

secret_scan:
  stage: security_test
  dependencies: []
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: "0"                      # full history, so secrets in old commits are found
  script:
    - |
      $report = Join-Path $env:CI_PROJECT_DIR 'trufflehog-report.json'
      $lines = @(& trufflehog.exe git file://. --json --no-update | Where-Object { $_ -match '^\s*\{' })
      if ($LASTEXITCODE -ne 0) { throw "TruffleHog failed (exit code $LASTEXITCODE)" }
      [System.IO.File]::WriteAllLines($report, [string[]]$lines)   # UTF-8 without BOM
      $verified = @($lines | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object { $_.Verified -eq $true })
      Write-Host "TruffleHog: $($lines.Count) finding(s), $($verified.Count) verified"
      if ($env:SECURITY_GATE -eq 'true' -and $verified.Count -gt 0) {
        throw "Security gate: $($verified.Count) verified secret(s) found"
      }
  artifacts:
    when: always
    paths:
      - trufflehog-report.json
    expire_in: 1 week

SAST_scan:
  stage: security_test
  dependencies: []
  script:
    - |
      semgrep scan --config auto --disable-version-check --json-output=semgrep-report.json .
      if ($LASTEXITCODE -ne 0) { throw "Semgrep failed (exit code $LASTEXITCODE)" }
      $results = @((Get-Content -Raw -LiteralPath 'semgrep-report.json' | ConvertFrom-Json).results)
      $blocking = @($results | Where-Object { $_.extra.severity -eq 'ERROR' })
      Write-Host "Semgrep: $($results.Count) finding(s), $($blocking.Count) with severity ERROR"
      if ($env:SECURITY_GATE -eq 'true' -and $blocking.Count -gt 0) {
        throw "Security gate: $($blocking.Count) Semgrep ERROR finding(s)"
      }
  artifacts:
    when: always
    paths:
      - semgrep-report.json
    expire_in: 1 week

SCA_SCAN:
  stage: security_test
  dependencies: []
  resource_group: dependency-check-data   # the NVD cache must not be used by two jobs at once
  script:
    - |
      if ([string]::IsNullOrWhiteSpace($env:NVD_API_KEY)) { throw 'CI/CD variable NVD_API_KEY is not set' }
      $failOn = if ($env:SECURITY_GATE -eq 'true') { $env:DC_FAIL_ON_CVSS } else { '11' }
      dependency-check.bat --project "$env:CI_PROJECT_NAME" --scan . --exclude "**/.git/**" --format XML --out dependency-check-report --data "$env:TOOLS_DIR\dependency-check-data" --nvdApiKey "$env:NVD_API_KEY" --failOnCVSS $failOn
      if ($LASTEXITCODE -ne 0) { throw "Dependency-Check exited with code $LASTEXITCODE (scan error, or CVSS >= $failOn with SECURITY_GATE=true)" }
  artifacts:
    when: always
    paths:
      - dependency-check-report/dependency-check-report.xml
    expire_in: 1 week

# ----------------------------------------------------------------------------- container

containerize:
  stage: containerize
  script:
    - 'docker build --file Dockerfile.api --tag $env:IMAGE_NAME --label "org.opencontainers.image.revision=$env:CI_COMMIT_SHA" .'

container_scan:
  stage: container_scan
  dependencies: []
  script:
    - |
      # Install the pinned Trivy once per runner, verified against the release checksum file
      $ProgressPreference = 'SilentlyContinue'
      $trivyDir = Join-Path $env:TOOLS_DIR "trivy\$env:TRIVY_VERSION"
      $trivy = Join-Path $trivyDir 'trivy.exe'
      if (-not (Test-Path -LiteralPath $trivy)) {
        [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
        $base = "https://github.com/aquasecurity/trivy/releases/download/v$env:TRIVY_VERSION"
        $zipName = "trivy_$($env:TRIVY_VERSION)_windows-64bit.zip"
        $sumName = "trivy_$($env:TRIVY_VERSION)_checksums.txt"
        $zip = Join-Path $env:TEMP $zipName
        $sums = Join-Path $env:TEMP $sumName
        Invoke-WebRequest -UseBasicParsing -Uri "$base/$zipName" -OutFile $zip -ErrorAction Stop
        Invoke-WebRequest -UseBasicParsing -Uri "$base/$sumName" -OutFile $sums -ErrorAction Stop
        $line = Get-Content -LiteralPath $sums | Where-Object { $_ -match ('\s' + [regex]::Escape($zipName) + '$') } | Select-Object -First 1
        $expected = if ($line) { ($line -split '\s+')[0] } else { '' }
        $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash
        if (-not $expected -or $actual -ne $expected) { throw "Trivy checksum mismatch (expected '$expected', got '$actual')" }
        New-Item -ItemType Directory -Force -Path $trivyDir -ErrorAction Stop | Out-Null
        Expand-Archive -LiteralPath $zip -DestinationPath $trivyDir -Force -ErrorAction Stop
        Remove-Item -LiteralPath $zip, $sums -Force -ErrorAction SilentlyContinue
      }

      # Full report for DefectDojo. Note: Trivy cannot detect OS packages in Windows
      # images, so for a Windows base image this covers application dependencies only.
      & $trivy image $env:IMAGE_NAME --no-progress --format json --output trivy-report.json --exit-code 0
      if ($LASTEXITCODE -ne 0) { throw "Trivy scan failed (exit code $LASTEXITCODE)" }

      if ($env:SECURITY_GATE -eq 'true') {
        & $trivy image $env:IMAGE_NAME --no-progress --skip-db-update --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 --format table
        if ($LASTEXITCODE -ne 0) { throw 'Security gate: fixable CRITICAL vulnerabilities in the image' }
      }
  after_script:
    - |
      # Feature-branch images are never published; don't let them fill the runner's disk
      if ($env:CI_COMMIT_BRANCH -ne $env:CI_DEFAULT_BRANCH) { docker rmi $env:IMAGE_NAME 2>$null | Out-Null }
  artifacts:
    when: always
    paths:
      - trivy-report.json
    expire_in: 1 week

container_publish:
  stage: publish
  dependencies: []
  script:
    - '$env:CI_REGISTRY_PASSWORD | docker login $env:CI_REGISTRY --username $env:CI_REGISTRY_USER --password-stdin'
    - 'docker push $env:IMAGE_NAME'
  after_script:
    - 'docker logout $env:CI_REGISTRY'
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# ----------------------------------------------------------------------------- deploy

deploy_windows:
  stage: deploy
  dependencies:
    - build
  resource_group: production              # one deploy at a time
  environment:
    name: production
  script:
    # Static files: mirror so files removed from the build don't linger
    - |
      robocopy "$env:CI_PROJECT_DIR\build-output\public" "$env:DEPLOY_ROOT\public" /MIR /NFL /NDL /NJH /NJS /NP /R:2 /W:2
      if ($LASTEXITCODE -ge 8) { throw "robocopy failed (exit code $LASTEXITCODE)" }
      $global:LASTEXITCODE = 0

    - '$env:CI_REGISTRY_PASSWORD | docker login $env:CI_REGISTRY --username $env:CI_REGISTRY_USER --password-stdin'
    - 'docker pull $env:IMAGE_NAME'

    # Resolve the DB host as seen from inside the container
    - |
      $dockerGateway = docker network inspect nat --format "{{(index .IPAM.Config 0).Gateway}}"
      if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($dockerGateway)) { throw 'Could not determine the Docker NAT gateway' }
      $env:CONTAINER_PGHOST = if ($env:DEPLOY_PGHOST -in @('localhost', '127.0.0.1', '::1')) { $dockerGateway.Trim() } else { $env:DEPLOY_PGHOST }
      $env:CONTAINER_PGPORT = if ([string]::IsNullOrWhiteSpace($env:DEPLOY_PGPORT)) { '5432' } else { [string][int]$env:DEPLOY_PGPORT }
      if ([string]::IsNullOrWhiteSpace($env:CONTAINER_PGHOST)) { throw 'CI/CD variable DEPLOY_PGHOST is not set' }
      if (-not (Test-NetConnection -ComputerName $env:CONTAINER_PGHOST -Port ([int]$env:CONTAINER_PGPORT) -InformationLevel Quiet)) {
        throw "PostgreSQL is unreachable at $($env:CONTAINER_PGHOST):$($env:CONTAINER_PGPORT)"
      }

    # Start the API; credentials go through a temp env-file, not the command line
    - |
      $envFile = [System.IO.Path]::GetTempFileName()
      try {
        [System.IO.File]::WriteAllLines($envFile, [string[]]@(
          'PORT=3000',
          "PGHOST=$env:CONTAINER_PGHOST",
          "PGPORT=$env:CONTAINER_PGPORT",
          "PGDATABASE=$env:DEPLOY_PGDATABASE",
          "PGUSER=$env:DEPLOY_PGUSER",
          "PGPASSWORD=$env:DEPLOY_PGPASSWORD"
        ))
        $old = docker ps -aq --filter 'name=^local-tasks-api$'
        if ($old) { docker rm -f $old | Out-Null }
        docker run --detach --name local-tasks-api --restart unless-stopped --publish 3000:3000 --env-file $envFile $env:IMAGE_NAME
        if ($LASTEXITCODE -ne 0) { throw "docker run failed (exit code $LASTEXITCODE)" }
      }
      finally {
        Remove-Item -LiteralPath $envFile -Force -ErrorAction SilentlyContinue
      }

    # nginx: test the new config before it goes live, restore the old one if invalid
    - |
      $nginxConf = 'C:\nginx\conf\nginx.conf'
      $backup = "$nginxConf.bak"
      if (Test-Path -LiteralPath $nginxConf) { Copy-Item -LiteralPath $nginxConf -Destination $backup -Force -ErrorAction Stop }
      Copy-Item -LiteralPath "$env:CI_PROJECT_DIR\build-output\nginx.windows.conf" -Destination $nginxConf -Force -ErrorAction Stop
      & 'C:\nginx\nginx.exe' -t -p 'C:\nginx' -c 'conf\nginx.conf'
      if ($LASTEXITCODE -ne 0) {
        if (Test-Path -LiteralPath $backup) { Copy-Item -LiteralPath $backup -Destination $nginxConf -Force }
        throw 'New nginx config is invalid; previous config restored'
      }
      Push-Location 'C:\nginx'
      try {
        & .\nginx.exe -s reload
        if ($LASTEXITCODE -ne 0) { throw "nginx reload failed (exit code $LASTEXITCODE)" }
      }
      finally { Pop-Location }

    # Health checks with retries: site responds and the API container stays up
    - |
      $healthy = $false
      for ($i = 1; $i -le 10 -and -not $healthy; $i++) {
        try {
          $response = Invoke-WebRequest -Uri 'http://localhost/' -UseBasicParsing -TimeoutSec 10
          $healthy = ($response.StatusCode -eq 200)
        } catch { Start-Sleep -Seconds 3 }
      }
      if (-not $healthy) { throw 'Health check failed: http://localhost/ did not return 200' }
      $running = docker inspect --format '{{.State.Running}}' local-tasks-api
      if ("$running".Trim() -ne 'true') {
        docker logs --tail 50 local-tasks-api
        throw 'API container is not running'
      }

    # Remove older local images of this project (the registry keeps them for rollback)
    - |
      docker images $env:CI_REGISTRY_IMAGE --format '{{.Repository}}:{{.Tag}}' |
        Where-Object { $_ -and $_ -ne $env:IMAGE_NAME -and $_ -notmatch ':<none>$' } |
        ForEach-Object { docker rmi $_ 2>$null | Out-Null }
      $global:LASTEXITCODE = 0
  after_script:
    - 'docker logout $env:CI_REGISTRY'
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# ----------------------------------------------------------------------------- DAST

DAST:
  stage: dast
  dependencies: []
  resource_group: production              # scan exactly what is deployed; no deploy mid-scan
  script:
    - |
      $report = Join-Path $env:CI_PROJECT_DIR 'zap-report.xml'
      zap.bat -cmd -quickurl http://localhost/ -quickout $report -quickprogress
      if ($LASTEXITCODE -ne 0) { throw "ZAP failed (exit code $LASTEXITCODE)" }
      if (-not (Test-Path -LiteralPath $report)) { throw "ZAP did not produce $report" }
  artifacts:
    when: always
    paths:
      - zap-report.xml
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# ----------------------------------------------------------------------------- DefectDojo

defectdojo_upload:
  stage: report
  when: always                            # upload whatever reports exist, even after a failed gate
  resource_group: defectdojo              # concurrent auto_create_context calls could create duplicates
  needs:
    - job: secret_scan
      artifacts: true
    - job: SAST_scan
      artifacts: true
    - job: SCA_SCAN
      artifacts: true
    - job: container_scan
      artifacts: true
    - job: DAST
      artifacts: true
      optional: true                      # DAST only exists on the default branch
  script:
    - |
      $uploads = @(
        @{ File = 'trufflehog-report.json';                              ScanType = 'Trufflehog Scan' },
        @{ File = 'semgrep-report.json';                                 ScanType = 'Semgrep JSON Report' },
        @{ File = 'dependency-check-report\dependency-check-report.xml'; ScanType = 'Dependency Check Scan' },
        @{ File = 'trivy-report.json';                                   ScanType = 'Trivy Scan' },
        @{ File = 'zap-report.xml';                                      ScanType = 'ZAP Scan' }
      )
      $failed = @()
      foreach ($upload in $uploads) {
        try {
          & .\scripts\defectdojo-upload.ps1 -File $upload.File -ScanType $upload.ScanType
        } catch {
          Write-Host "ERROR uploading $($upload.ScanType): $($_.Exception.Message)"
          $failed += $upload.ScanType
        }
      }
      if ($failed.Count -gt 0) { throw "DefectDojo upload failed for: $($failed -join ', ')" }