stages:
  - verify
  - deploy

verify:
  stage: verify
  tags:
    - windows
  script:
    - '$errors = $null; [System.Management.Automation.Language.Parser]::ParseFile("$env:CI_PROJECT_DIR\server.ps1", [ref]$null, [ref]$errors) | Out-Null; if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }'
    - '& "C:\Program Files\PostgreSQL\17\bin\psql.exe" --version'

deploy_windows:
  stage: deploy
  tags:
    - windows
  variables:
    APP_PORT: "8083"
    DEPLOY_ROOT: "C:\\apps\\local-tasks"
  script:
    - '$ErrorActionPreference = "Stop"'
    - 'New-Item -ItemType Directory -Force -Path "$env:DEPLOY_ROOT\public" | Out-Null' #
    - 'Copy-Item "$env:CI_PROJECT_DIR\public\*" "$env:DEPLOY_ROOT\public" -Recurse -Force'
    - 'Copy-Item "$env:CI_PROJECT_DIR\server.ps1", "$env:CI_PROJECT_DIR\start-background.ps1" $env:DEPLOY_ROOT -Force'
    - 'Copy-Item "$env:CI_PROJECT_DIR\nginx.windows.conf" "C:\nginx\conf\nginx.conf" -Force'
    - '$old = Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -like "*$env:DEPLOY_ROOT\server.ps1*" }; $old | ForEach-Object { Stop-Process -Id $_.ProcessId -Force }'
    - '$env:PGHOST = $env:DEPLOY_PGHOST; $env:PGPORT = $env:DEPLOY_PGPORT; $env:PGDATABASE = $env:DEPLOY_PGDATABASE; $env:PGUSER = $env:DEPLOY_PGUSER; $env:PGPASSWORD = $env:DEPLOY_PGPASSWORD; & "$env:DEPLOY_ROOT\start-background.ps1"'
    - '& "C:\nginx\nginx.exe" -t -p C:\nginx -c conf\nginx.conf'
    - 'Push-Location C:\nginx; & .\nginx.exe -s reload; if ($LASTEXITCODE -ne 0) { throw "Nginx reload failed" }; Pop-Location'
    - '$response = Invoke-WebRequest http://localhost/ -UseBasicParsing; if ($response.StatusCode -ne 200) { throw "Nginx health check failed" }'
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'