stages:
  - build
  - security_test
  - verify
  - containerize
  - container_scan
  - container_publish
  - deploy
  - DAST

build:
  stage: build
  tags:
    - windows
  script:
    - 'npm install --omit=dev'
    - 'npm run build'
  artifacts:
    paths:
      - build-output/
    expire_in: 1 week

secret_scan:
  stage: security_test
  tags:
    - windows
  script:
    - trufflehog.exe gitlab --token $GITLAB_TOKEN --repo https://gitlab.com/appsec-group1/test.git

SAST_scan:
  stage: security_test
  tags:
    - windows
  script:
    - semgrep scan --config auto .

# SCA_SCAN:
#   stage: security_test
#   tags:
#     - windows
#   script:
#     - dependency-check.bat --scan . --nvdApiKey $NVD_API_KEY

verify:
  stage: verify
  tags:
    - windows
  script:
    - 'node --check app.js'
    - 'npm run build'

containerize:
  stage: containerize
  tags:
    - windows
  variables:
    IMAGE_NAME: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
  script:
    - '$ErrorActionPreference = "Stop"'
    - 'docker build --file Dockerfile.api --tag $env:IMAGE_NAME .'

container_scan:
  stage: container_scan
  tags:
    - windows
  needs:
    - containerize
  variables:
    IMAGE_NAME: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
  script:
    - '$ErrorActionPreference = "Stop"'
    - 'docker image inspect $env:IMAGE_NAME | Out-Null'
    - '$trivyVersion = "0.74.0"; $trivyZip = Join-Path $env:TEMP "trivy-$trivyVersion.zip"; Invoke-WebRequest -Uri "https://github.com/aquasecurity/trivy/releases/download/v$trivyVersion/trivy_$($trivyVersion)_windows-64bit.zip" -OutFile $trivyZip; Expand-Archive -Path $trivyZip -DestinationPath "$env:CI_PROJECT_DIR\.trivy" -Force'
    - '& "$env:CI_PROJECT_DIR\.trivy\trivy.exe" image $env:IMAGE_NAME --no-progress --exit-code 1 --severity HIGH,CRITICAL'
  allow_failure: true

container_publish:
  stage: container_publish
  tags:
    - windows
  needs:
    - container_scan
  variables:
    IMAGE_NAME: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
  script:
    - '$ErrorActionPreference = "Stop"'
    - 'docker image inspect $env:IMAGE_NAME | Out-Null'
    - '$env:CI_REGISTRY_PASSWORD | docker login $env:CI_REGISTRY --username $env:CI_REGISTRY_USER --password-stdin'
    - 'docker push $env:IMAGE_NAME'
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

deploy_windows:
  stage: deploy
  tags:
    - windows
  needs:
    - job: build
      artifacts: true
    - job: container_publish
  variables:
    IMAGE_NAME: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
    DEPLOY_ROOT: "C:\\apps\\local-tasks"
  script:
    - '$ErrorActionPreference = "Stop"'
    - 'New-Item -ItemType Directory -Force -Path "$env:DEPLOY_ROOT\public" | Out-Null' #
    - 'Copy-Item "$env:CI_PROJECT_DIR\build-output\public\*" "$env:DEPLOY_ROOT\public" -Recurse -Force'
    - 'Copy-Item "$env:CI_PROJECT_DIR\build-output\nginx.windows.conf" "C:\nginx\conf\nginx.conf" -Force'
    - '$env:CI_REGISTRY_PASSWORD | docker login $env:CI_REGISTRY --username $env:CI_REGISTRY_USER --password-stdin'
    - 'docker pull $env:IMAGE_NAME'
    - '$oldContainer = docker ps -aq --filter "name=^local-tasks-api$"; if ($oldContainer) { docker rm -f $oldContainer }'
    - '$containerDbHost = $env:DEPLOY_PGHOST; if ([string]::IsNullOrWhiteSpace($containerDbHost) -or $containerDbHost -in @("localhost", "127.0.0.1", "::1")) { $containerDbHost = "host.docker.internal" }; $env:CONTAINER_PGHOST = $containerDbHost'
    - 'docker run --detach --name local-tasks-api --restart unless-stopped --publish 3000:3000 --env PORT=3000 --env PGHOST=$env:CONTAINER_PGHOST --env PGPORT=$env:DEPLOY_PGPORT --env PGDATABASE=$env:DEPLOY_PGDATABASE --env PGUSER=$env:DEPLOY_PGUSER --env PGPASSWORD=$env:DEPLOY_PGPASSWORD $env:IMAGE_NAME'
    - '& "C:\nginx\nginx.exe" -t -p C:\nginx -c conf\nginx.conf'
    - 'Push-Location C:\nginx; & .\nginx.exe -s reload; if ($LASTEXITCODE -ne 0) { throw "Nginx reload failed" }; Pop-Location'
    - '$response = Invoke-WebRequest http://localhost/ -UseBasicParsing; if ($response.StatusCode -ne 200) { throw "Nginx health check failed" }'
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

DAST:
  stage: DAST
  tags:
    - windows
  script:
    - zap.bat -cmd -quickurl http://localhost/ -quickprogress
  artifacts:
    paths:
      - testreport.html
    expire_in: 1 week